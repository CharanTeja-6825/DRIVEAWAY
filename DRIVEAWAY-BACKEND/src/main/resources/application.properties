spring.application.name=DRIVEAWAY-BACKEND
server.port=2006

# MongoDB Configuration
spring.mongodb.uri=${DB_URL}
spring.mongodb.database=${DB_NAME}
spring.data.mongodb.auto-index-creation=true

# Razorpay Configuration
razorpay.keyId=${RZP_KEY}
razorpay.secret=${RZP_SECRET}

# Security Configuration
spring.security.user.name=charan
spring.security.user.password=charan

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Frontend URI
spring.client=${CLIENT_API}

# Swagger Config
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Database Debugging
logging.level.com.mongodb.driver=DEBUG

# Server Configuration
server.forward-headers-strategy=framework

# Cloudinary Configuration
cloudinary.cloud=${CLOUDINARY_CLOUD}
cloudinary.key=${CLOUDINARY_KEY}
cloudinary.secret=${CLOUDINARY_SECRET}


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Redis Configuration
spring.data.redis.url=${REDIS_URL}
spring.cache.type=redis