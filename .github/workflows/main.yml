name: Deploy to Render

on:
  # Trigger after Docker images are built and pushed
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  deploy-to-render:
    environment: DOCKER
    runs-on: ubuntu-latest
    # Only run if the Docker build was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Trigger Backend Deployment
        run: |
          curl -X POST https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
      
      - name: Trigger Frontend Deployment
        run: |
          curl -X POST https://api.render.com/v1/services/${{ secrets.RENDER_FRONTEND_SERVICE_ID }}/deploys \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
      
      - name: Deployment Triggered
        run: |
          echo "✅ Backend deployment triggered"
          echo "✅ Frontend deployment triggered"
          echo "Check your Render dashboard for deployment status"
